name: Docs

on:
  push:
    branches: [dev, master]
    paths:
      - 'docs-site/**'
      - 'packs/*/pack-manifest.json'
      - 'packs/*/.opencode/skills/*/SKILL.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install docs dependencies
        run: uv pip install --system -r docs-site/pyproject.toml

      - name: Generate skill reference pages
        run: python docs-site/scripts/generate_skill_reference.py --packs-dir packs --docs-dir docs-site/docs

      - name: Build MkDocs site
        run: mkdocs build
        working-directory: docs-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
